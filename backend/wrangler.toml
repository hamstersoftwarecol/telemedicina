name = "telemedicina-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "telemedicina-db"
database_id = "873c3289-10d5-45b6-a9ee-a49fe3e2164f"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "59b6da7756cc485faf7f5841d75db374"

[[r2_buckets]]
binding = "R2"
bucket_name = "telemedicina-storage"

[vars]
JWT_EXPIRES_IN = "15m"
JWT_REFRESH_EXPIRES_IN = "7d"
FRONTEND_URL = "https://telemed.hamstersoftware.com"
APP_NAME = "TelemedApp"
APP_ENV = "production"
CLOUDFLARE_ACCOUNT_ID = "0a752097fea8d3d143836ffcb796bdc1"
CLOUDFLARE_PAGES_PROJECT = "telemedicina-frontend"

# Secrets must be set via `wrangler secret put <NAME>`
# See wrangler.toml.example for list

[dev]
port = 8787
local_protocol = "http"
